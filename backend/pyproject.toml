[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "mjc0042",email = "mjc0042@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=5.2.4,<6.0.0)",
    "django-ninja (>=1.4.3,<2.0.0)",
    "django-cors-headers (>=4.7.0,<5.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "django-ninja-jwt (>=5.3.7,<6.0.0)",
    "psycopg (>=3.2.9,<4.0.0)",
    "pydantic (>=2.11.7,<3.0.0)",
    "geopandas (>=1.1.3,<2.0.0)",
    "fiona (>=1.10.1,<2.0.0)",
    "pypdf (>=5.6.0,<6.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "common @ ../../municipal-finance-viewer/common"
]

#[tool.poetry.dependencies]
#common = { path = "../common/", develop = true }

package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu118"
priority = "explicit"

[tool.poetry.group.gpu]
optional = true

[tool.poetry.group.gpu.dependencies]
torch = { version = "2.7.1", source = "pytorch-cuda" }
torchvision = { version = "0.22.1", source = "pytorch-cuda" }
torchaudio = { version = "2.7.1", source = "pytorch-cuda" }